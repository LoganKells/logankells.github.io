[project]
name = "logankells.github.io"
version = "0.0.1"
description = "Logan Kells' personal website"
authors = [
    { name = "Logan Kells", email = "lkells@outlook.com" },
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "click",
    # report issue for docutils >=0.18,<0.20 until https://github.com/mcmtroffaes/sphinxcontrib-bibtex/issues/322 is fixed
    "docutils",
    "ghp-import",
    "Jinja2",
    "jsonschema",
    "jsx-lexer",
    "jupyter",
    "jupyter-book>=1.0.4,<2.0.0",
    "linkify-it-py",
    "myst-nb",
    "pyyaml",
    "sphinx>=7.0,<8.0",
    "sphinx-click",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx_examples",
    "sphinx-external-toc",
    "sphinxext-rediraffe",
    "sphinx-inline-tabs",
    "sphinx-jupyterbook-latex>=1.0,<2.0",
    "sphinx-design>=0.7,<0.8",
    "sphinx-thebe",
    "sphinx-book-theme",
    "sphinx-proof",
    "sphinx_togglebutton",
    "sphinxcontrib-bibtex>=2.5.0,<3.0.0",
    "sphinx-multitoc-numbering",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "reproducible",
    "science",
    "environments",
    "scholarship",
    "notebook",
    "logan",
    "kells",
]

[tool.poetry]
package-mode = false

#[build-system]
#requires = ["flit_core >=3.5,<4"]
#build-backend = "flit_core.buildapi"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://logankells.com/"
Documentation = "https://jupyterbook.org"
Source = "https://github.com/LoganKells/logankells.github.io/"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]

